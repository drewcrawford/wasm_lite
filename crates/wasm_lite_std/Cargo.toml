# wasm_lite_std — a std::thread + std::sync veneer for wasm_lite.
#
# Ported from drewcrawford's `wasm_safe_thread` (MIT OR Apache-2.0). The native
# backend (std::thread) is used verbatim; the wasm32 backend is being retargeted
# off wasm-bindgen onto wasm_lite's `thread::spawn` primitive + core atomics.
[package]
name = "wasm_lite_std"
description = "std-shaped thread, sync, time, and optional async filesystem APIs over wasm_lite."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[features]
default = []
diagnostics = ["wasm_lite/diagnostics"]
# Async, read-only std::fs-shaped API. Its native pool and Priority type stay
# out of existing users' dependency graphs until this is requested.
fs = ["dep:blocking", "dep:priority"]
# Structured observation for `fs`, through the zero-dependency `logwise` facade.
# Deliberately its own feature rather than part of `fs`: a consumer who wants
# files should not acquire an observation facade they never asked for, and with
# this off the call sites are not compiled at all. The facade is inert until a
# runtime installs a dispatcher, so enabling this still emits nothing on its own.
logwise = ["dep:logwise"]

[dependencies]
atomic-waker = "1.1.2"
priority = { version = "0.1.1", optional = true }
# Temporary pre-release pin for the coordinated breaking migration; switch to a
# crates.io version once the facade release is published. Every crate sharing a
# graph must name the *same* revision -- two git revisions of the facade are two
# crates to cargo, hence two install-once dispatch globals.
logwise = { git = "ssh://gitea@gitea.mermaid-gecko.ts.net/Metropolis/logwise.git", rev = "1be396ff30588ad32453596bbaa45afb568368f7", optional = true }

[target.'cfg(not(target_arch="wasm32"))'.dependencies]
blocking = { version = "1.6.2", optional = true }

[target.'cfg(target_arch="wasm32")'.dependencies]
wasm_lite = { workspace = true }

# Browser test suite (wasm32, via the wasm_lite runner). harness = false because
# libtest doesn't run on wasm32-unknown-unknown; #[wasm_lite_test] + the runner
# drive it instead.
[[test]]
name = "browser"
harness = false

# `wasm_lite::fetch`'s browser suite. It lives here rather than in `wasm_lite`
# because awaiting needs `spawn_local`, and a dev-dependency pointing the other
# way would link two copies of a crate with `#[no_mangle]` exports.
[[test]]
name = "fetch"
harness = false

[[test]]
name = "fs"
harness = false
required-features = ["fs"]

# The observation contract for `fs`: event names, per-field privacy, and what a
# view that asked for less is *not* given. Separate target because it needs the
# `logwise` feature, which `fs` alone must not turn on.
[[test]]
name = "fs_logwise"
harness = false
required-features = ["fs", "logwise"]

# `wasm_lite::websocket`'s browser suite, here for the same reason. Its peer is
# the runner's own echo endpoint.
[[test]]
name = "websocket"
harness = false

# `wasm_lite::dom`'s browser suite. Its peer is the test page itself.
[[test]]
name = "dom"
harness = false
