# wasm_lite_std — a std::thread + std::sync veneer for wasm_lite.
#
# Ported from drewcrawford's `wasm_safe_thread` (MIT OR Apache-2.0). The native
# backend (std::thread) is used verbatim; the wasm32 backend is being retargeted
# off wasm-bindgen onto wasm_lite's `thread::spawn` primitive + core atomics.
[package]
name = "wasm_lite_std"
description = "std::thread + std::sync veneer over wasm_lite (ported from wasm_safe_thread)."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[dependencies]
atomic-waker = "1.1.2"

[target.'cfg(target_arch="wasm32")'.dependencies]
wasm_lite = { path = "../wasm_lite" }

# Native only: the wasm side uses wasm_lite's own test macros, and the published
# test_executors pulls wasm_safe_thread and therefore wasm-bindgen into the test
# binary — which the runner refuses as a wasm-bindgen interop module.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
test_executors = "0.4.1"

# Browser test suite (wasm32, via the wasm_lite runner). harness = false because
# libtest doesn't run on wasm32-unknown-unknown; #[wasm_lite_test] + the runner
# drive it instead.
[[test]]
name = "browser"
harness = false

# `wasm_lite::fetch`'s browser suite. It lives here rather than in `wasm_lite`
# because awaiting needs `spawn_local`, and a dev-dependency pointing the other
# way would link two copies of a crate with `#[no_mangle]` exports.
[[test]]
name = "fetch"
harness = false

# `wasm_lite::websocket`'s browser suite, here for the same reason. Its peer is
# the runner's own echo endpoint.
[[test]]
name = "websocket"
harness = false
