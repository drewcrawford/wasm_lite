# SPDX-License-Identifier: MIT OR Apache-2.0
#
# NOTE: the package name is deliberately `wasm_lite_std`, so `[patch]` can
# substitute this for the real crate.
[package]
name = "wasm_lite_std"
description = "wasm-bindgen-backed shim for wasm_lite_std, layered over wasm_safe_thread (the crate wasm_lite_std was ported from)."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[features]
default = []
# Keep feature spelling and dependency isolation identical to the real crate.
fs = ["dep:blocking", "dep:priority", "dep:web-sys"]
# Same spelling, same isolation, same events -- a feature that silently did
# nothing under this backend would be worse than not having it.
logwise = ["dep:logwise"]

[dependencies]
wasm_safe_thread = "0.1"
priority = { version = "0.1.1", optional = true }
logwise = { git = "ssh://gitea@gitea.mermaid-gecko.ts.net/Metropolis/logwise.git", rev = "1be396ff30588ad32453596bbaa45afb568368f7", optional = true }

[target.'cfg(not(target_arch="wasm32"))'.dependencies]
blocking = { version = "1.6.2", optional = true }

[target.'cfg(target_arch="wasm32")'.dependencies]
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-time = "1.1"
web-sys = { version = "0.3", optional = true, features = [
    "Headers",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "Request",
    "RequestInit",
    "Response",
] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
