

[workspace]
resolver = "2"



members = [
    "crates/wasm_lite",
    "crates/wasm_lite_macro",
    "crates/wasm_lite_codegen",
    "crates/wasm_lite_cli",
    "crates/wasm_lite_std",
]


# The wasm example is its own detached crate: it's a `bin` that links against a
# wasm-only import, so it must never be built for the host target. Build it
# explicitly for wasm32. (`wasm_lite` itself is an rlib and builds fine on the
# host, so it stays a workspace member for IDE/CI coverage.)
# `backend-wasm-bindgen/` is its own workspace: it reuses the package names `wasm_lite` and
# `wasm_lite_std` so `[patch]` can substitute it, and two packages cannot share
# a name inside one workspace.
exclude = ["backend-wasm-bindgen", "examples/hello-rust", "examples/atomics-demo", "examples/threads-demo", "examples/std-threads-demo", "examples/async-demo", "examples/async-mutex-demo", "examples/panic-demo", "examples/await-panic-demo", "examples/async-pass-demo", "examples/async-fail-demo", "examples/async-doctest-demo", "examples/worker-spawn-local-demo"]

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.95.0"
authors = ["Drew Crawford <drew@sealedabstract.com>"]
license = "MIT OR Apache-2.0"
keywords = ["wasm", "webassembly", "javascript", "bindings", "wasm-bindgen"]
categories = ["wasm", "web-programming", "development-tools::ffi", "concurrency", "asynchronous"]
repository = "https://github.com/drewcrawford/wasm_lite"
homepage = "https://sealedabstract.com/code/wasm_lite"

# Internal dependencies, declared once. A path alone is enough to build, but not
# to publish: `cargo package` rejects a dependency with no version requirement,
# because the published crate has to name what it needs from the registry rather
# than from a directory that will not exist. Keeping them here means the version
# is written in one place instead of drifting across four manifests.
#
# The version cannot inherit from `workspace.package` above — cargo has no
# `version.workspace` inside `workspace.dependencies` — so this literal is the
# one that has to move at release time.
#
# Deliberately absent: `wasm_lite_macro`'s dev-dependencies on `wasm_lite` and
# `wasm_lite_std`. Those point *back* at crates that depend on it, and a
# versioned cycle cannot be published in any order. Cargo drops a dev-dependency
# that carries only a path, so leaving them bare is what makes the cycle
# publishable.
[workspace.dependencies]
wasm_lite = { path = "crates/wasm_lite", version = "0.1.3" }
wasm_lite_macro = { path = "crates/wasm_lite_macro", version = "0.1.3" }
wasm_lite_codegen = { path = "crates/wasm_lite_codegen", version = "0.1.3" }

# NOTE: no dev-cycle self-patch here, deliberately. `test_executors` is the
# obvious crate to reach for when a test needs to drive a future, but it depends
# back on wasm_lite_std, so patching it to the local path makes wasm_lite_std's
# *lib* tests link two copies of wasm_lite_std -- the cfg(test) one and the rlib
# reached via test_executors -- and both define #[no_mangle] __wl_async_tick /
# __wl_executor_idle, so the link fails on duplicate symbols.
#
# So wasm_lite_std drives its own futures instead: `async_test_body!` in tests
# and `async_doctest!` in doctests, both of which work on wasm32 as well as
# native. Nothing in this workspace depends on test_executors.
