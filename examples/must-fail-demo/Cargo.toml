[package]
name = "must-fail-demo"
version = "0.1.0"
edition = "2024"

[dependencies]
wasm_lite = { path = "../../crates/wasm_lite" }
wasm_lite_std = { path = "../../crates/wasm_lite_std" }

# `tests/mixed_harness.rs` is deliberately *not* declared here. Leaving it at
# cargo's default `harness = true` is the whole point: libtest owns `main`, and
# the fixture checks the runner still runs it.

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[workspace]
