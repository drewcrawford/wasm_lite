[package]
name = "must-fail-demo"
version = "0.1.0"
edition = "2024"

[dependencies]
wasm_lite = { path = "../../crates/wasm_lite" }
wasm_lite_std = { path = "../../crates/wasm_lite_std" }

# None of the test targets here are declared, deliberately. For
# `tests/mixed_harness.rs` that is the whole point: cargo's default
# `harness = true` puts libtest in charge of `main`, and the fixture checks the
# runner still runs it. `async_body.rs` and `async_hang.rs` only need to be
# ordinary test targets.

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[workspace]
