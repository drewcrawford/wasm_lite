# SPDX-License-Identifier: MIT OR Apache-2.0
#
# Reuses the `wasm-bindgen-test` package name so an application can substitute
# it alongside the `wasm-bindgen` shim.
[package]
name = "wasm-bindgen-test"
description = "wasm-bindgen-test's API, lowered onto wasm_lite's harness. Not the real crate."
# Matches what the graph asks for, as the wasm-bindgen shim does.
version = "0.3.56"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
name = "wasm_bindgen_test"
path = "src/lib.rs"

[dependencies]
wasm_lite = "0.1.2"
wasm-bindgen-test-macro-wl = { path = "../wasm_bindgen_test_macro_wl" }
# Only for `async fn` tests: it needs an executor, and on wasm that means
# `wasm_lite_std` — which requires nightly and an atomics build. Off by
# default so a suite with no async tests pays neither.
wasm_lite_std = { version = "0.1.2", optional = true }

[features]
async = ["dep:wasm_lite_std"]
