# SPDX-License-Identifier: MIT OR Apache-2.0
#
# The **fake-wasm-bindgen** shim: `wasm-bindgen`'s API, lowered onto wasm_lite.
# The mirror of `backend-wasm-bindgen/`, which goes the other way (wasm_lite's API lowered onto
# wasm-bindgen).
#
# Its own workspace, and separate from `backend-wasm-bindgen/` for two reasons: this member
# reuses the *package name* `wasm-bindgen` (substitution matches on package
# name, and one workspace cannot hold two packages sharing a name), and the
# `backend-wasm-bindgen/` members depend on the *real* wasm-bindgen, which would be exactly
# that collision.
[workspace]
resolver = "2"
members = [
    "wasm_bindgen",
    "wasm_bindgen_macro_wl",
    "wasm_bindgen_test",
    "wasm_bindgen_test_macro_wl",
    "consumer-demo",
    "consumer-async",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
authors = ["Drew Crawford <drew@sealedabstract.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/drewcrawford/wasm_lite"
homepage = "https://sealedabstract.com/code/wasm_lite"
