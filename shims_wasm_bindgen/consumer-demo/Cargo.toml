# SPDX-License-Identifier: MIT OR Apache-2.0
#
# Stands in for js-sys / web-sys / wgpu: a crate that depends on
# `wasm-bindgen` and **not** on wasm_lite. If its bindings compile and run,
# the substitution mechanism works for unmodified upstream crates.
[package]
name = "consumer-demo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
# Deliberately the only dependency. Adding wasm_lite here would invalidate the
# whole point of this crate.
wasm-bindgen = { path = "../wasm_bindgen" }

[dev-dependencies]
# Test-harness only. `#[wasm_lite_test]`/`test_main!` are how the browser runner
# discovers tests; a real upstream crate needs none of this, exactly as it needs
# no `wasm-bindgen-test` in its non-test build.
wasm_lite = { path = "../../crates/wasm_lite" }
# The companion shim: a crate substituting `wasm-bindgen` almost always has
# suites written against `#[wasm_bindgen_test]` too.
wasm-bindgen-test = { path = "../wasm_bindgen_test" }

[[test]]
name = "bindings"
harness = false

# `harness = false` is the one thing the test shim cannot do for a consumer:
# wasm_lite's runner discovers tests from a wasm section and owns `main`.
[[test]]
name = "wbt_harness"
harness = false
