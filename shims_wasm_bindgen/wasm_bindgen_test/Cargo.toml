# SPDX-License-Identifier: MIT OR Apache-2.0
#
# Reuses the `wasm-bindgen-test` package name so an application can substitute
# it alongside the `wasm-bindgen` shim.
[package]
name = "wasm-bindgen-test"
description = "wasm-bindgen-test's API, lowered onto wasm_lite's harness. Not the real crate."
# Matches what the graph asks for, as the wasm-bindgen shim does.
version = "0.3.56"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
name = "wasm_bindgen_test"
path = "src/lib.rs"

[dependencies]
wasm_lite = { path = "../../crates/wasm_lite" }
wasm-bindgen-test-macro-wl = { path = "../wasm_bindgen_test_macro_wl" }
