# NOTE: the package name is deliberately `wasm_lite_std`, so `[patch]` can
# substitute this for the real crate.
[package]
name = "wasm_lite_std"
description = "wasm-bindgen-backed shim for wasm_lite_std, layered over wasm_safe_thread (the crate wasm_lite_std was ported from)."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[dependencies]
wasm_safe_thread = "0.1"

[target.'cfg(target_arch="wasm32")'.dependencies]
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-time = "1.1"
